name: Documentation and quickstarts

on:
  push:
    branches: [master, develop]
    paths:
      - "src/**"
      - "python/**"
      - "matlab/**"
      - "docs/**"
      - "scripts/test_docs_quickstarts.py"
      - "README.md"
      - "CMakeLists.txt"
      - "cmake/**"
      - "pyproject.toml"
      - ".github/workflows/documentation.yml"
  pull_request:
    paths:
      - "src/**"
      - "python/**"
      - "matlab/**"
      - "docs/**"
      - "scripts/test_docs_quickstarts.py"
      - "README.md"
      - "CMakeLists.txt"
      - "cmake/**"
      - "pyproject.toml"
      - ".github/workflows/documentation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python build dependencies
        run: python -m pip install --upgrade pip build numpy

      - name: Extract, compile, and run the C++ quickstart
        run: >-
          python scripts/test_docs_quickstarts.py
          --output build/docs-quickstarts
          --language cpp

      - name: Build and install only the wheel artifact
        run: |
          python -m build --wheel --outdir build/docs-wheel
          python -m pip install --force-reinstall --no-deps build/docs-wheel/*.whl

      - name: Run the extracted Python quickstart
        run: >-
          python scripts/test_docs_quickstarts.py
          --output build/docs-quickstarts
          --language python

      - name: Build Doxygen API documentation
        uses: mattnotmitt/doxygen-action@v1.9.5
        with:
          doxyfile-path: docs/Doxyfile

      - uses: actions/configure-pages@v6

      - name: Build Jekyll site
        uses: actions/jekyll-build-pages@v1
        with:
          source: docs
          destination: _site

      - name: Attach generated API documentation
        run: mv build/Doxygen/html _site/Doxygen

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
